# 10주차: 배포 서버(EC2)에서 쓰는 설정이에요. 비밀 값은 전부 실행 환경의 환경변수로 받아요.
# 필요한 값의 목록은 프로젝트 루트의 .env.production.example에 있어요.
server:
  address: 0.0.0.0 # 서버 밖에서 들어오는 요청도 받아요.
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/movie_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate # 운영 데이터는 앱 시작 시 자동으로 바꾸지 않고, 스키마가 맞는지만 확인해요.

app:
  cors:
    # 기본값을 두지 않아요. 프론트 주소를 빠뜨리면 서버가 시작할 때 바로 알 수 있어요.
    # 예: https://umcine.vercel.app,http://localhost:3000 (경로나 끝의 / 없이 적어요)
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
