# 10주차: 모든 환경이 함께 쓰는 설정이에요. 환경마다 달라지는 값은 프로필 파일로 나눴어요.
# - application-local.yml: 내 컴퓨터 (프로필을 지정하지 않으면 이 파일을 읽어요)
# - application-prod.yml: 배포 서버 (SPRING_PROFILES_ACTIVE=prod)
spring:
  application:
    name: movie
  profiles:
    default: local
  jpa:
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600} # 토큰 유효시간(초)
